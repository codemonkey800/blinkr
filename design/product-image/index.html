<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"tagline","type":"string","label":"Tagline","default":"A silent, visual-only repeating timer."},{"id":"flash","type":"color","label":"Flash color","default":"#ffb547"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e1014;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="hero"
        data-composition-id="hero"
        data-composition-src="compositions/hero.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
