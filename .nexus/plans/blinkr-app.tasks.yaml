        status: done
        commit: 0295beffb1144bc2ceec879ac8b203d946da0951
        body: |-
          `design/mockups/blinkr.html` is reviewed in the Nexus frames viewer, which shows
          the page without running its scripts. Today the static frames fill in their
          contents from script at load: every `[data-chrome]` title bar (via `chromeHTML`)
