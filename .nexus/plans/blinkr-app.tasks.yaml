      - id: T17
        title: 'Fix: settings panel overshoots and snaps back in WebKit'
        after: []
        files:
          - src/App.css
          - src/app/layout.test.ts
        status: done
        commit: 541bdc8c0dc6a8558cfb8eaddb0faa3eadd413b1
        body: |-
          Bug the user found: when the settings panel opens in the native app, it slides
          left past its resting place to the window's left edge, then jumps back right.
          This happens in WebKit, which the macOS Tauri webview uses. Chrome is fine.

          Cause, reproduced in Playwright WebKit at 760×480: `.app` in `src/App.css` has
          `overflow: hidden`, so it is still a scroll container. During the `panel-in`
          animation in `src/settings/settings.css`, the panel starts at
          `translateX(100%)` and adds 380 px of scrollable overflow to `.app`. WebKit then
          scrolls `.app` to reveal the focused interval input, even though the focus call
          passes `preventScroll: true`. `.app.scrollLeft` reads 380 for the whole
          animation, so the panel lands at left 0. When the animation ends the overflow
          goes away, `scrollLeft` clamps to 0, and the panel snaps back to left 380. The
          gear, `S`, and the right-click menu all trigger it.

          Fix: in `src/App.css`, give `.app` `overflow: clip`, keeping
          `overflow: hidden` on the line before it as a fallback. `clip` makes `.app`
          no longer a scroll container, so nothing can scroll it. With that one change the
          panel slides from 760 to 380 with `scrollLeft` staying 0. Don't change the
          panel animation, the focus code, or the CSP.

          Test: add `src/app/layout.test.ts`, a Vitest test that reads `src/App.css` with
          `node:fs` and asserts the `.app` rule declares `overflow: clip`, with a comment
          that explains the WebKit bug. jsdom can't run layout, so this test only guards
          the rule.

          Live check in WebKit. Start Vite with `pnpm exec vite --port <free port>`.
          Install Playwright in a temp directory outside the repo:
          `mkdir /tmp/pwk && cd /tmp/pwk && npm init -y && npm i playwright && npx playwright install webkit`.
          Launch `webkit` at a 760×480 viewport. Open the panel by the gear, `S`, and
          right-click then "Open settings". On each animation frame for 700 ms, sample
          `.panel` `getBoundingClientRect().left` and `.app` `scrollLeft`. The left edge
          must only decrease, from 760 down to 380, and `scrollLeft` must stay 0. Report
          the samples before and after the fix in `notes`. Stop Vite when you're done.
