      - id: T2
        title: Vitest and the settings model
        after: []
        files:
          - package.json
          - pnpm-lock.yaml
          - vitest.config.ts
          - tsconfig.node.json
          - src/settings/model.ts
          - src/settings/model.test.ts
        status: done
        commit: 35c04530112b00ebc878a5f0b41846576281146e
        body: |-
          Add Vitest as the unit test runner and the shared settings model.

          Dev dependencies, pinned exactly: `vitest` 5.1.1 (it accepts Vite 7), `jsdom`,
          `@testing-library/react`, `@testing-library/dom`, and `@testing-library/user-event`,
          at versions compatible with React 19.1. Create `vitest.config.ts` with the React
          plugin, `environment: 'jsdom'`, and `include: ['src/**/*.test.{ts,tsx}']`. Add
          that file to `tsconfig.node.json` `include`. Set the `test` script to
          `node --test "tests/**/*.test.mjs" && vitest run`. The quoted glob is expanded by
          Node, so it also works on Windows. Vitest must exit non-zero when it finds no test
          files, which is its default; don't pass `--passWithNoTests`.

          Create `src/settings/model.ts`:
          ```ts
          export type IntervalUnit = 'seconds' | 'minutes' | 'hours';
          export type FlashStyle = 'pulse' | 'blink';
          export interface Settings {
            interval: { value: number; unit: IntervalUnit }; // total 1 s .. 24 h
            flashDurationSeconds: number; // 0.5 .. 30
            colors: string[];             // 1 .. 6 entries, lowercase '#rrggbb'
            style: FlashStyle;
            intensity: number;            // percent, integer 10 .. 100
            rate: number;                 // flashes per second, 0.25 .. 3, step 0.25
            idleColor: string;            // '#rrggbb'
            alwaysOnTop: boolean;
          }
          export const DEFAULT_SETTINGS: Settings; // 10 min, 2 s, ['#ffb547'], 'pulse', 60, 1, '#1b1e25', false
          export const LIMITS: { /* min and max for each numeric field, MAX_COLORS = 6 */ };
          export function intervalMs(i: Settings['interval']): number;
          export type FieldErrors = Partial<Record<'interval' | 'flashDurationSeconds' | 'colors' | 'intensity' | 'rate' | 'idleColor', string>>;
          export function validateSettings(s: Settings): FieldErrors; // {} when valid
          export function sanitizeSettings(raw: unknown): Settings;
          export function isStrongFlash(s: Pick<Settings, 'style' | 'intensity' | 'rate'>): boolean; // rate > 2 || (blink && intensity > 70)
          ```
          `sanitizeSettings` never throws. It takes each field from `raw` when it is valid,
          falls back to the default field by field, and drops unknown keys. Colors are
          normalized to lowercase `#rrggbb`; bad entries are dropped, the list is truncated
          to 6, and an empty result falls back to the default. Out-of-range numbers fall back
          to the default; they are not clamped. Error messages use plain copy saying what
          range works, e.g. "Enter a time between 1 second and 24 hours."

          Tests in `src/settings/model.test.ts`:
          - The defaults are valid.
          - Each limit's bound is accepted and the value just outside it is rejected.
          - Unit conversion for seconds, minutes, and hours.
          - `sanitizeSettings` for `null`, a string, an array, a partial object, wrong types,
            NaN and Infinity, bad colors, 7 colors, and unknown keys.
          - `isStrongFlash` at each threshold.
      - id: T3
        title: Drift-free repeating schedule and timer hook
        after:
          - T2
        files:
          - src/timer/
        status: done
        commit: a4e3f9cd1399490652a162b3f486a96ce5802c64
        body: |-
          Create the timer as a pure schedule function plus a React hook. Use the `Settings`
          type and `intervalMs` from `src/settings/model.ts`.

          ```ts
          // src/timer/schedule.ts
          export interface Schedule { startedAt: number; intervalMs: number; flashMs: number }
          export type TimerPhase =
            | { kind: 'idle'; cycle: number; endsAt: number }
            | { kind: 'flash'; cycle: number; startedAt: number; endsAt: number };
          export function phaseAt(s: Schedule, now: number): TimerPhase;
          // src/timer/useBlinkTimer.ts
          export function useBlinkTimer(opts: { intervalMs: number; flashMs: number; now?: () => number }):
            { running: boolean; phase: TimerPhase | null; start(): void; stop(): void; restart(): void };
          ```
          Semantics: each cycle is the interval followed by the flash. Cycle `k` flashes from
          `startedAt + (k+1)*intervalMs + k*flashMs` for `flashMs`. `phaseAt` computes this
          from absolute time only, with no accumulated state, so a late or skipped timer
          never shifts later flashes. `cycle` is the 0-based cycle index.

          The hook schedules one `setTimeout` to the next boundary (`endsAt`), then
          recomputes from the clock. If it wakes late it jumps straight to the correct phase.
          It also recomputes on `visibilitychange` and window `focus`. Default clock is
          `Date.now`. `stop` clears timers and sets `phase` to null. `restart` keeps running
          with `startedAt = now`, for timing changes made while running. When interval or
          flash length changes while running, restart. Clean up on unmount.

          No countdown or remaining time is exposed to the UI beyond `phase`.

          Tests with `vi.useFakeTimers()` and an injected clock:
          - The exact boundaries for the first three cycles.
          - A timer fired 5 s late lands in the right phase and doesn't shift cycle 3.
          - The clock jumping a whole cycle ahead, as after a sleep, skips a missed flash
            instead of replaying it.
          - Stop, restart, and an option change while running.
          - Unmount clears pending timers.
      - id: T4
        title: CSS-driven flash surface
        after:
          - T2
        files:
          - src/flash/
        status: done
        commit: ee4f85603950c739c728fdbd4b365afff9318788
        body: |-
          Create the component that fills the window with the idle color and renders a flash.

          ```ts
          // src/flash/FlashSurface.tsx
          export function FlashSurface(props: {
            idleColor: string; colors: string[]; style: FlashStyle;
            intensity: number; rate: number;
            flashing: boolean;    // true for the flash's duration
            flashKey: number;     // changes per flash so the animation restarts at 0
            children?: React.ReactNode;
          }): JSX.Element;
          // src/flash/colors.ts
          export function colorForPulse(colors: string[], pulseIndex: number): string;
          ```
          Put the keyframes in `src/flash/flash.css`, imported by the component. No `<style>`
          injection, since the CSP forbids it. Drive them with custom properties set via the
          `style` prop: `--flash-color`, `--flash-peak` (intensity / 100), and
          `--flash-period` (1 / rate seconds).
          - Pulse eases opacity 0 to peak to 0 each period.
          - Blink is on at peak for half the period, then off, using `step-end`.
          The flash layer is absolutely positioned over the whole surface with
          `pointer-events: none`. Colors advance one per pulse, starting at the first color
          on every flash, by counting `animationiteration` events.

          Under `prefers-reduced-motion: reduce`, show the first color steady at peak for the
          flash's duration, without oscillating. When `flashing` is false, render the idle
          color only.

          Tests in jsdom:
          - Idle color with no flash.
          - The flash layer's custom properties for each style.
          - Color advances on fired `animationiteration` events and wraps around.
          - A new `flashKey` restarts at the first color.
          - The reduced-motion class when `matchMedia` reports it.
          - `colorForPulse` with one color and with several.
