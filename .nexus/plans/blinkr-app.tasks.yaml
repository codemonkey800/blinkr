          keep settings in one `useState` that those tasks can lift. The app starts stopped.

          Follow the approved mockup (`design/mockups/blinkr.html`) and H1's verdict for:
          - The minimal control bar: Start or Stop and a settings (gear) button. It shows
            whenever the timer is stopped. While running the window is blank until the
            pointer moves, the window is clicked, or Tab is pressed; then the bar fades in
            and fades out again after about 2 s idle or when the pointer leaves, but never
            while one of its buttons has focus. Under reduced motion it shows and hides
