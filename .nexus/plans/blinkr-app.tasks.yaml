        body: |-
          Replace the placeholder in `src/main.tsx` with `src/App.tsx`. The app renders
          `FlashSurface` (from `src/flash/FlashSurface.tsx`) full-window and drives it from
          `useBlinkTimer` (from `src/timer/useBlinkTimer.ts`). Settings come from
