nexus-tasks: 1
phases:
  - key: '1'
    name: Core timer, flash, and settings
    tasks:
      - id: T1
        title: 'Mockup: Blinkr window, flash, and settings'
        after: []
        files:
          - design/mockups/blinkr.html
        status: done
        commit: 029a66c702043aa57c458aa009165a9907c8ce40
        body: |-
          Create `design/mockups/blinkr.html`, one self-contained HTML page for the user to
          review. Before designing, invoke the `frontend-design:frontend-design` skill with
          the Skill tool and follow it: plan the tokens, check them against its list of
          generic defaults, build, then screenshot the page in headless Chrome
          (`mcp__chrome__new_page` with a `file://` URL) and fix what looks wrong.

          Read `README.md` first. The product is a blank resizable window with no countdown
          that flashes a color on an interval. Show each of these as framed window states at
          realistic sizes. The default window is 760×480.
          - Stopped idle window with one faint hint on how to open settings and start.
          - Running idle window that is completely blank.
          - The on-demand ways to reach settings: click, right-click menu, and the `S` key.
            Space starts and stops. Escape or the close button closes settings.
          - Flash states: smooth pulse (the default), hard blink, and several colors where
            each pulse takes the next color in order. Animate them with CSS keyframes driven
            by custom properties for peak opacity and period.
          - The settings panel with interval (number plus seconds, minutes, or hours), flash
            duration, colors (1 to 6, add and remove), idle color, style, intensity, rate,
            always-on-top, Start/Stop, and Preview flash. Preview plays one real flash in
            the window. Starting the timer hides the panel.
          - The intensity control with the photosensitivity warning next to it, in its calm
            state and its stronger state.
          - Validation errors for out-of-range interval and duration, with Start disabled.
          - Where the phase 2 features will sit, marked as later: borderless, fullscreen, a
            global start/stop shortcut (off by default, with a Wayland note), and a preset
            picker with save, rename, and delete.
          - A table of defaults and limits.

          Proposed defaults and limits, for the user to confirm at review:
          - Interval: 10 minutes. Range 1 second to 24 hours.
          - Flash duration: 2 seconds. Range 0.5 to 30 seconds.
          - Colors: amber `#ffb547`. 1 to 6 colors.
          - Style: pulse.
          - Intensity: 60%, meaning peak opacity of the flash over the idle color.
            Range 10% to 100%.
          - Rate: 1 per second. Range 0.25 to 3 per second, in steps of 0.25.
          - Idle color: a dark neutral.
          - Always on top: off.
          The warning turns stronger when rate is above 2/s, or for blink above 70%.
          Under reduced motion the flash holds steady instead of oscillating.

          Make the panel's controls live in the mockup: intensity, rate, and style update the
          preview, and Preview flash plays one flash. Use system fonts only, no remote assets.
          Write copy in plain sentence case. Run `pnpm format` so `pnpm format:check` passes.
          In `notes`, list each design choice the reviewer should confirm.
