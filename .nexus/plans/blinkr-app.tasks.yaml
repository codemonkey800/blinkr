          Fix it so the page looks complete with JavaScript disabled:
          - Write the title bar markup and the control bar markup (Start or Stop button,
            separator, gear icon as inline SVG) directly into the HTML of every static
            frame. Remove the script code that injected them, or make it skip elements
            that already have content.
          - The live window at the top must also show its stopped state, with the title
            bar and the Start/gear bar, as static HTML before any script runs. Its script
            then only adds behaviour: toggling Start/Stop, opening the panel, fading.
          - Check the rest of the page the same way: settings panels, menus, tooltips,
            color swatches, warning states, and the defaults table must all be present in
            the static HTML. Only interactive behaviour may depend on script.
          - Keep the look, copy, and every section unchanged otherwise.

          Verify it: in headless Chrome, open the file with JavaScript disabled (for
          example with `mcp__chrome__emulate` or by loading a copy with the `<script>`
