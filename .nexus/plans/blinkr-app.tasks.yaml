        status: done
        commit: 9d84d118cadd591f117dd315930a5a89828b86f2
        body: |-
          Add `tauri-plugin-store` =2.5.1 to `src-tauri/Cargo.toml` and
          `@tauri-apps/plugin-store` 2.5.1 to `package.json`, both pinned exactly. Update
          both lockfiles. Register the plugin in `src-tauri/src/lib.rs`.

          Create `src-tauri/capabilities/main.json` for window `main`, granting only the
          store commands the adapter calls. Use individual `store:allow-*` permissions,
          never `store:default`. Confirm the identifiers in
          `src-tauri/gen/schemas/desktop-schema.json` after `pnpm build` and a Cargo build.
          Create `tests/capabilities.test.mjs`, a Node test that reads every file in
          `src-tauri/capabilities/` and asserts the exact sorted permission list and windows
          `["main"]`. Later tasks extend that list.

          ```ts
          // src/persistence/settingsStore.ts
          export interface KeyValueBackend { get(key: string): Promise<unknown>; set(key: string, value: unknown): Promise<void> }
          export function tauriBackend(): Promise<KeyValueBackend>; // store file 'blinkr.json', saved after each set
          export function browserBackend(storage?: Storage): KeyValueBackend; // localStorage, JSON
          export function defaultBackend(): Promise<KeyValueBackend>; // isTauri() ? tauri : browser
          export function loadSettings(b: KeyValueBackend): Promise<Settings>; // key 'settings', via sanitizeSettings
          export function saveSettings(b: KeyValueBackend, s: Settings): Promise<void>;
          export function createDebouncedSaver(b: KeyValueBackend, ms?: number): { save(s: Settings): void; flush(): Promise<void> };
          ```
          Take `sanitizeSettings` and `Settings` from `src/settings/model.ts`. A load
          failure or corrupt value yields defaults, never a throw. A save failure is logged
          with `console.warn` and not rethrown. Phase 2 stores presets under a separate key in
          the same store, so keep the key a parameter internally.

          Tests with an in-memory backend and a fake `Storage`:
          - Round trip.
          - Missing key gives defaults.
          - A corrupt JSON string in `localStorage` gives defaults.
          - A partially invalid object gives field-level defaults.
          - The debounce coalesces rapid saves, and `flush` writes the last one.
          - A rejected save doesn't throw.
