          - Keys: Space toggles start and stop. Ignore keys while focus is in a form field.
          The gear, `S`, and right-click open the settings panel when it lands; give the
          gear an `onOpenSettings` hook that does nothing yet.
          Suppress the webview's default context menu.

          Dev-only overrides, for the visual checkpoint and browser checks: when
          `import.meta.env.DEV`, read URL params and pass them through `sanitizeSettings`:
          `interval` (seconds), `duration`, `style`, `intensity`, `rate`, `colors`
          (comma-separated hex, without `#`), and `idle`. Add `autostart=1` to start
          immediately. Production builds ignore them. Put this in
          `src/app/devOverrides.ts` with tests.

          Tests in `src/App.test.tsx`, with fake timers:
          - Stopped shows the control bar with Start and the gear.
          - Space starts and the bar hides; nothing else renders.
          - While running, pointer movement reveals the bar with Stop, and it hides again
            after the idle delay. It stays while a bar button has focus.
          - The Start and Stop buttons toggle the timer.
          - After the interval the flash is on, and after the duration it's off.
          - Space stops.
          - Space typed in an input does nothing.

          Then run it live. Start Vite on a free port and use headless Chrome on
          `?interval=3&duration=2&autostart=1`. Sample the flash layer's computed opacity
          over time with `evaluate_script` to confirm it flashes and returns to idle twice.
          Take screenshots. Report the URLs that work for H2, and any defects as
          `defects:`.
