name: Release

# Publishes installers to a rolling "latest" GitHub Release after CI passes on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runs queue instead of cancelling, so a publish is never cut off halfway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    # Only pushes to this repo's main, never a fork PR whose branch happens to be named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - name: windows
            os: windows-latest
            rust-targets: ''
            args: --bundles nsis
          # 22.04, not 24.04: an AppImage only runs on distros with a glibc at least as new.
          - name: linux
            os: ubuntu-22.04
            rust-targets: ''
            args: --bundles appimage,deb
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.rust-targets }}
      - name: Restore Cargo registry and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-cargo-${{ matrix.name }}-rust-1.99.1-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        run: pnpm tauri build --ci ${{ matrix.args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      # Stable names keep the /releases/latest/download/<name> links working across versions.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          bundle=src-tauri/target/release/bundle
          case "${{ matrix.name }}" in
            macos)
              files=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
              cp "${files[0]}" out/Blinkr-macos-universal.dmg
              ;;
            windows)
              files=("$bundle"/nsis/*-setup.exe)
              cp "${files[0]}" out/Blinkr-windows-x64-setup.exe
              cp src-tauri/target/release/blinkr.exe out/Blinkr-windows-x64-portable.exe
              ;;
            linux)
              files=("$bundle"/appimage/*.AppImage)
              cp "${files[0]}" out/Blinkr-linux-x86_64.AppImage
              files=("$bundle"/deb/*.deb)
              cp "${files[0]}" out/Blinkr-linux-amd64.deb
              ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: out
          merge-multiple: true
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Built from ${SHA:0:7} on main.

          | Platform | Download |
          | --- | --- |
          | macOS (Apple Silicon and Intel) | Blinkr-macos-universal.dmg |
          | Windows 10 and 11, installer | Blinkr-windows-x64-setup.exe |
          | Windows 10 and 11, portable | Blinkr-windows-x64-portable.exe |
          | Linux, any distro | Blinkr-linux-x86_64.AppImage |
          | Linux, Debian and Ubuntu | Blinkr-linux-amd64.deb |

          These installers are not code-signed, so the first launch shows a warning.

          - **macOS:** open the DMG and drag Blinkr to Applications. On first launch, choose Done,
            then go to System Settings, Privacy & Security, and click Open Anyway.
          - **Windows:** when SmartScreen appears, click More info, then Run anyway. The portable
            exe runs without installing, and keeps its settings in your user AppData folder.
          - **Linux AppImage:** mark it executable with \`chmod +x\`, then run it.
          EOF
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/* \
            --target "$SHA" \
            --title "Blinkr (latest)" \
            --notes-file notes.md \
            --latest
