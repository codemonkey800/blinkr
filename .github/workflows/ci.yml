name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-24.15.0-pnpm-9.15.9-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - id: pnpm-store-unix
        if: runner.os != 'Windows'
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - id: pnpm-store-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"path=$(pnpm store path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append'
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store-unix.outputs.path || steps.pnpm-store-windows.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-24.15.0-pnpm-9.15.9-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore Cargo registry and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-node-24.15.0-pnpm-9.15.9-${{ hashFiles('src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm tauri build --no-bundle --ci
